name:                hsbisync
version:             0.1.1
github:              "vincentaxhe/hsbisync"
license:             MIT
author:              "Vincent"
maintainer:          "vincentaxhe"
copyright:           "2026 Vincent"

description:         A bidirectional file sync tool written in Haskell

dependencies:
- async
- base >= 4.7 && < 5
- bytestring
- containers
- cryptonite
- directory
- filepath
- gitignore-ospath
- memory
- process
- text
- time
- unix

# 纯命令行工具：不建 library。
# 若把 source-dirs: . 设为 library，hpack 会把 Main.hs 也纳入库模块，
# 导致库编译时多一次 "Linking Main"、生成多余的 Main 产物。
executables:
  hsbisync:
    main:                Main.hs
    source-dirs:         .
    ghc-options:
    - -Wall
    - -O2
    # -threaded 是必需的：
    #  * 与 helper 的协议里有阻塞读（hGetLine/BS.hGet），非 threaded RTS 下主线程
    #    卡住时其他 Haskell 线程（停滞看门狗、concurrently 的另一端）完全无法调度，
    #    表现为整个程序"静默卡死"且无法诊断；
    #  * concurrently 并行读两端状态也需要它才真正并行。
    - -threaded
    # -rtsopts：允许用 +RTS 调运行时（诊断内存 / GC 时需要）：
    #   +RTS -s            打印最大驻留（maximum residency）
    #   +RTS -M<size>      给堆设上限（能传完 = 内存确实 O(1)）
    #   +RTS -c            压缩式 GC
    - -rtsopts
