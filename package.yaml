name:                hsbisync
version:             0.1.0.0
github:              "user/hsbisync"
license:             MIT
author:              "Vincent"
maintainer:          "vincent@example.com"
copyright:           "2026 Vincent"

description:         A bidirectional file sync tool written in Haskell

dependencies:
- json
- async
- base >= 4.7 && < 5
- bytestring
- containers
- cryptonite
- directory
- filepath
- gitignore-ospath
- memory
- process
- text
- time
- unix

# 纯命令行工具：不建 library。
# 若把 source-dirs: . 设为 library，hpack 会把 Main.hs 也纳入库模块，
# 导致库编译时多一次 "Linking Main"、生成多余的 Main 产物。
executables:
  hsbisync:
    main:                Main.hs
    source-dirs:         .
    ghc-options:
    - -Wall
    - -O2
